services:
  db:
    image: mysql:8.0
    container_name: mysql_django_42
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --max-connections=30
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: